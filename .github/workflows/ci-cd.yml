name: AAP MCP Server CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: quay.io
  IMAGE_NAME: your-org/aap-mcp-server
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint & Type Check ───────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff mypy black -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src/

      - name: Black format check
        run: black --check src/

      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/unit/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  # ── Integration Tests ───────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: integration
    env:
      AAP_CONTROLLER_URL: ${{ secrets.AAP_CONTROLLER_URL }}
      AAP_OAUTH_TOKEN: ${{ secrets.AAP_OAUTH_TOKEN }}
      AAP_MCP_READ_ONLY_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        run: pytest tests/integration/ -v -m "not destructive"

  # ── Build Container Image ───────────────────────────────────────────────────
  build:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Helm Chart Validation ───────────────────────────────────────────────────
  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/aap-mcp/

      - name: Template test
        run: helm template aap-mcp helm/aap-mcp/ --debug

  # ── Deploy to Dev ───────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build, helm-lint]
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Login to OpenShift
        run: oc login --token=${{ secrets.OCP_DEV_TOKEN }} --server=${{ secrets.OCP_DEV_URL }}

      - name: Deploy via Helm
        run: |
          helm upgrade --install aap-mcp helm/aap-mcp/ \
            --namespace aap-mcp-dev \
            --create-namespace \
            --set image.tag=sha-${{ github.sha }} \
            --set aap.existingSecret=aap-mcp-credentials \
            --wait --timeout=5m

  # ── Deploy to Production ────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, integration-test]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Login to OpenShift
        run: oc login --token=${{ secrets.OCP_PROD_TOKEN }} --server=${{ secrets.OCP_PROD_URL }}

      - name: Deploy via Helm
        run: |
          helm upgrade --install aap-mcp helm/aap-mcp/ \
            --namespace aap-mcp \
            --create-namespace \
            --set image.tag=${{ github.ref_name }} \
            --set aap.existingSecret=aap-mcp-credentials \
            --set route.enabled=true \
            --wait --timeout=5m
